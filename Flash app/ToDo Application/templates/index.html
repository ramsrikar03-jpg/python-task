<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container{
            width:400px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .add-btn{
            display:block;
            width:100%;
            padding:12px;
            margin-bottom:20px;
            background:#4CAF50;
            color:white;
            text-align:center;
            text-decoration:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .add-btn:hover{
            background:#45a049;
        }

        ul{
            list-style:none;
        }

        li{
            background:#f4f4f4;
            margin-bottom:12px;
            padding:12px;
            border-radius:10px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:17px;
            transition:0.3s;
        }

        li:hover{
            transform:scale(1.02);
            background:#ececec;
        }

        .delete-btn{
            background:#ff4d4d;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
            transition:0.3s;
        }

        .delete-btn:hover{
            background:#cc0000;
        }

        .empty{
            text-align:center;
            color:gray;
            margin-top:10px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>📝 My Todo List</h1>

        <a href="{{ url_for('add_task') }}" class="add-btn">
            + Add New Task
        </a>

        <ul>
            {% for task in tasks %}
                <li>
                    <span>{{ task }}</span>

                    <a href="{{ url_for('delete_task', index=loop.index0) }}">
                        <button class="delete-btn">Delete</button>
                    </a>
                </li>
            {% endfor %}
        </ul>

        {% if tasks|length == 0 %}
            <p class="empty">No tasks available</p>
        {% endif %}

    </div>

</body>
</html>
