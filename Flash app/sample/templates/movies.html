{% extends 'base.html' %}
{% block content %}
<h2 class="text-3xl font-extrabold tracking-tight mb-8">Now Showing</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    {% for id, movie in movies.items() %}
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col group hover:border-slate-700 transition">
        <img src="{{ movie.banner }}" alt="{{ movie.title }}" class="w-full h-56 object-cover group-hover:scale-105 transition duration-300">
        <div class="p-6 flex flex-col flex-grow">
            <span class="text-xs font-semibold tracking-wide uppercase text-rose-500 mb-1">{{ movie.genre }}</span>
            <h3 class="text-xl font-bold mb-2">{{ movie.title }}</h3>
            <p class="text-emerald-400 font-medium mb-4">${{ "%.2f"|format(movie.price) }} per ticket</p>
            
            <form action="{{ url_for('select_seats', movie_id=id) }}" method="GET" class="mt-auto">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Showtime:</label>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    {% for timing in movie.timings %}
                    <label class="cursor-pointer">
                        <input type="radio" name="timing" value="{{ timing }}" required class="peer hidden">
                        <div class="bg-slate-950 border border-slate-800 text-center text-sm py-2 rounded-lg font-medium tracking-wide transition peer-checked:bg-rose-600 peer-checked:border-rose-600 peer-checked:text-white hover:bg-slate-800">
                            {{ timing }}
                        </div>
                    </label>
                    {% endfor %}
                </div>
                <button type="submit" class="w-full text-center bg-slate-800 hover:bg-rose-600 text-white font-medium py-2.5 rounded-xl transition duration-150">
                    Book Seats
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
