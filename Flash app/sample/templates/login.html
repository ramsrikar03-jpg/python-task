{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
    <h2 class="text-3xl font-bold mb-6 text-center">Sign In</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-400 mb-2">Username</label>
            <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:border-rose-500 text-white">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-400 mb-2">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:border-rose-500 text-white">
        </div>
        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-rose-600/20 transition duration-200">Login</button>
    </form>
    <p class="text-sm text-slate-400 text-center mt-6">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-rose-500 hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
